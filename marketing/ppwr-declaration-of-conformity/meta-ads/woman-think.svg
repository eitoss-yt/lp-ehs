<path d="M196 440 L262 418 L300 470 L300 560 L262 500 L240 520 Z" fill="#2e4372"/>
<path d="M404 440 L338 418 L300 470 L300 560 L338 500 L360 520 Z" fill="#283c69"/>
<path d="M262 418 L300 470 L300 560" fill="none" stroke="#1b2847" stroke-width="1.5" opacity=".5"/>
<!-- neck -->
<path d="M268 330 C268 370 262 400 254 422 C270 444 330 444 346 422 C338 400 332 370 332 330 Z" fill="url(#neck)"/>
<path d="M262 414 C285 432 315 432 338 414 L346 422 C330 444 270 444 254 422 Z" fill="#c98f72" opacity=".35"/>

<!-- head -->
<g transform="rotate(-7 300 330)">
