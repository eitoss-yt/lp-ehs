 <path d="M206 236 C192 228 186 252 194 270 C200 284 212 288 216 280 Z" fill="#eebfa5"/>
 <path d="M394 236 C408 228 414 252 406 270 C400 284 388 288 384 280 Z" fill="#e9b89c"/>
