<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8dfcd"/><stop offset="1" stop-color="#ecbfa5"/></linearGradient>
 <radialGradient id="face" cx=".45" cy=".42" r=".65"><stop offset="0" stop-color="#fae4d4"/><stop offset=".7" stop-color="#f2cdb6"/><stop offset="1" stop-color="#e6b398"/></radialGradient>
 <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a385"/><stop offset=".45" stop-color="#efc8b0"/><stop offset="1" stop-color="#f3d2bd"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d2b22"/><stop offset=".5" stop-color="#2a1d17"/><stop offset="1" stop-color="#1c1310"/></linearGradient>
 <linearGradient id="hairhi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a5a48" stop-opacity="0"/><stop offset=".5" stop-color="#8a6955" stop-opacity=".55"/><stop offset="1" stop-color="#7a5a48" stop-opacity="0"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34497c"/><stop offset=".6" stop-color="#25375f"/><stop offset="1" stop-color="#1b2847"/></linearGradient>
 <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b3f6c"/><stop offset=".55" stop-color="#3a5089"/><stop offset="1" stop-color="#22325a"/></linearGradient>
 <linearGradient id="blouse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ecf2"/></linearGradient>
 <radialGradient id="iris" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#7a5236"/><stop offset=".7" stop-color="#4a2f1f"/><stop offset="1" stop-color="#2a1a12"/></radialGradient>
 <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7867c"/><stop offset="1" stop-color="#c46d66"/></linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
 <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>

<!-- back hair -->
<g transform="rotate(-7 300 330)">
 <path d="M196 200 C186 120 250 78 306 80 C372 82 418 128 410 214 C420 300 430 370 404 420 C380 440 340 430 320 412 L282 412 C258 432 214 440 192 418 C168 372 184 296 196 200 Z" fill="url(#hair)"/>
</g>

<!-- body -->
<path d="M70 700 C76 560 112 470 196 440 L262 418 L300 470 L338 418 L404 440 C488 470 524 560 530 700 Z" fill="url(#jacket)"/>
<!-- blouse -->
<path d="M240 420 L300 560 L360 420 Z" fill="url(#blouse)"/>
