  <path d="M238 232 C246 220 270 218 282 230 C272 240 248 241 238 232 Z" fill="#fff"/>
  <circle cx="261" cy="230" r="9" fill="url(#iris)"/><circle cx="261" cy="230" r="4" fill="#120b08"/><circle cx="264" cy="226" r="2.6" fill="#fff"/>
