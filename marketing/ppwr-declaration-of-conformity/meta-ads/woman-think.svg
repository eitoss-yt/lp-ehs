  <path d="M240 238 C252 243 270 242 280 235" fill="none" stroke="#b07f68" stroke-width="1.2" opacity=".6"/>
 </g>
 <g>
  <path d="M318 230 C330 218 354 220 362 232 C352 241 328 240 318 230 Z" fill="#fff"/>
  <circle cx="339" cy="230" r="9" fill="url(#iris)"/><circle cx="339" cy="230" r="4" fill="#120b08"/><circle cx="342" cy="226" r="2.6" fill="#fff"/>
  <path d="M315 229 C328 214 356 216 366 231 C352 221 328 220 315 229 Z" fill="#1d1410"/>
  <path d="M320 235 C330 242 348 243 360 238" fill="none" stroke="#b07f68" stroke-width="1.2" opacity=".6"/>
 </g>
 <!-- nose -->
 <path d="M302 240 C304 260 308 274 312 284 C308 290 298 291 292 287" fill="none" stroke="#c48a70" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
 <ellipse cx="300" cy="284" rx="14" ry="6" fill="#d9a084" opacity=".25" filter="url(#soft2)"/>
 <!-- lips: slight, closed, mildly unsure -->
 <path d="M280 312 C288 306 296 308 300 309 C305 307 314 306 322 311 C314 314 306 314 300 313 C294 314 287 314 280 312 Z" fill="url(#lip)"/>
 <path d="M282 312 C292 322 310 322 320 312 C310 316 292 316 282 312 Z" fill="#d88b80"/>
 <path d="M290 322 C296 324 304 324 310 322" fill="none" stroke="#c48a70" stroke-width="1.2" opacity=".4"/>
 <!-- face side shading -->
 <path d="M372 220 C378 270 366 306 350 326 C366 300 376 266 372 220 Z" fill="#d79c80" opacity=".35" filter="url(#soft2)"/>
 <!-- front hair: side part, bangs swept -->
 <path d="M300 96 C246 94 198 128 196 196 C194 240 198 300 206 340 C214 300 214 250 222 206 C236 166 262 144 300 132 C330 150 352 178 366 214 C370 186 376 160 392 150 C404 170 404 220 406 280 C414 230 416 176 404 140 C384 104 344 94 300 96 Z" fill="url(#hair)"/>
 <path d="M300 132 C268 140 240 160 226 200 C240 168 266 148 300 140 Z" fill="#4c372b" opacity=".6"/>
 <path d="M226 120 C254 100 300 96 340 106" fill="none" stroke="url(#hairhi)" stroke-width="10" stroke-linecap="round"/>
 <path d="M214 200 C210 250 212 300 214 340" fill="none" stroke="#4e3a2e" stroke-width="2" opacity=".6"/>
 <path d="M398 190 C402 240 400 290 398 330" fill="none" stroke="#4e3a2e" stroke-width="2" opacity=".5"/>
</g>

<!-- arm: forearm up, hand at chin -->
<g transform="translate(6 46)">
<path d="M440 700 C452 640 456 590 446 548 C438 512 418 486 392 478 L346 386 C340 374 322 374 316 388 L330 470 C336 520 360 560 380 600 C392 630 396 670 394 700 Z" fill="url(#sleeve)"/>
<path d="M392 478 C418 486 438 512 446 548 C430 520 410 500 392 478 Z" fill="#1b2847" opacity=".5"/>
<!-- cuff -->
<path d="M314 392 C326 398 342 398 352 390 L344 372 C334 378 322 378 312 374 Z" fill="#f3f4f8"/>
<!-- hand -->
<path d="M312 374 C304 360 300 344 304 330 C308 318 318 316 324 322 C330 314 340 314 344 322 C350 316 358 318 360 328 C364 344 358 362 350 374 C338 380 324 380 312 374 Z" fill="url(#skin)"/>
<path d="M304 332 C298 322 300 310 308 306 C316 304 320 312 320 320" fill="url(#skin)"/>
<path d="M324 322 C326 334 326 346 322 356" fill="none" stroke="#c48a70" stroke-width="1.6" opacity=".6"/>
<path d="M344 322 C346 334 344 346 340 356" fill="none" stroke="#c48a70" stroke-width="1.6" opacity=".6"/>
<path d="M306 312 C312 318 318 322 322 330" fill="none" stroke="#c48a70" stroke-width="1.4" opacity=".5"/>
<path d="M312 374 C324 380 338 380 350 374" fill="none" stroke="#c48a70" stroke-width="1.4" opacity=".5"/>
</g>
</svg>
