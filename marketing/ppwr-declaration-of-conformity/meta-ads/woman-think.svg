 <ellipse cx="354" cy="276" rx="22" ry="12" fill="#ef9e8f" opacity=".28" filter="url(#soft)"/>
 <!-- brows: right brow slightly raised -->
 <path d="M236 200 C248 190 266 189 280 194 C268 192 250 194 238 203 Z" fill="#3a2a22"/>
 <path d="M320 190 C334 182 352 182 366 192 C352 188 336 189 322 195 Z" fill="#3a2a22"/>
 <!-- eyes -->
