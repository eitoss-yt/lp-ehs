<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.w{display:grid;grid-template-columns:1fr 50px 1.3fr 50px 1fr;align-items:center}
.b{border-radius:16px;padding:20px 20px;min-height:280px}
.b1{background:#F5F7FC;border:2px dashed var(--sky)}
.b2{background:var(--pale);border:3px solid var(--blue)}
.b3{background:var(--navy);color:#fff}
.lb{font-size:20px;font-weight:700;color:var(--blue);letter-spacing:.08em}
.b3 .lb{color:var(--sky)}
.h{font-size:28px;font-weight:900;color:var(--navy);margin:6px 0 14px}
.b3 .h{color:#fff}
ul{list-style:none;font-size:19px;line-height:1.7}
li:before{content:"・"}
.a{text-align:center;font-size:44px;color:var(--blue);font-weight:900}
.p{font-size:22px;line-height:1.7}
</style></head><body><div class="fig">
<div class="w">
<div class="b b1"><div class="lb">証拠</div><div class="h">サプライヤー情報</div><ul><li>材質・仕様書</li><li>重金属・PFASの試験報告書</li><li>サプライヤーの証明書</li></ul></div>
<div class="a">▶</div>
<div class="b b2"><div class="lb">根拠｜附属書VII</div><div class="h">技術文書</div><ul><li>包装の概要と用途／設計・材質</li><li>適用した規格・技術仕様の一覧</li><li>第6条・第10条・第11条の評価の説明</li><li>試験報告書</li></ul></div>
<div class="a">▶</div>
<div class="b b3"><div class="lb">結論｜附属書VIII</div><div class="h">適合宣言書</div><div class="p">技術文書で裏付けられる内容だけを宣言する1枚の文書</div></div>
</div>
<div class="cap">図4　適合宣言書と技術文書の関係（技術文書の不備はそれ自体が不適合：第62条）</div>
</div></body></html>
